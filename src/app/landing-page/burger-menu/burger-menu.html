<div class="burger" #burger>
  <div class="logo-wrapper">
    <img src="assets/img/logo2.png" alt="Developer Logo 2" class="logo" />
  </div>
  
  <button class="burger_btn" (click)="toggleMenu()" #burgerBtn>
    <img #burgerIcon class="burger-icon" src="assets/img/burger_menu_t0.svg" alt="menu" />
  </button>

  <ul class="nav-links" #navLinks>
    <li><a href="#why" (click)="closeMenu()">{{ 'NAV.WHY' | translate }}</a></li>
    <li><a href="#skills" (click)="closeMenu()">{{ 'NAV.SKILLS' | translate }}</a></li>
    <li><a href="#projects" (click)="closeMenu()">{{ 'NAV.PROJECTS' | translate }}</a></li>
    <li><a href="#contact" class="contact-link" (click)="closeMenu()">{{ 'NAV.CONTACT' | translate }}</a></li>
    <li class="language-switch">
      <span class="lang" [class.active]="languageService.currentLang === 'de'" (click)="languageService.setLanguage('de')">DE</span>
      <span class="lang" [class.active]="languageService.currentLang === 'en'" (click)="languageService.setLanguage('en')">EN</span>
    </li>
  </ul>
</div>
