<section class="contact">
  <h2 class="headline">Contact me</h2>
  <button class="arrow"></button>

  <div class="intro-wrapper">
    <p class="intro-text">
      Encourage people to contact you and describe what role you are interested in. Show that you
      will add value to their projects through your work.<br /><br />
      Example: Feel free to get in touch with job offers or opportunities such as …
    </p>

    <div class="contact-details">
      <div class="detail-item">
        <span class="mail"></span>
      </div>

      <div class="detail-item">
        <span class="phone"></span>
      </div>
    </div>
  </div>

  <form class="form" (submit)="send(); $event.preventDefault()">
    <div class="row">
      <div class="field">
        <label [class.error]="nameError">Your name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          [class.error]="nameError"
          [class.valid]="!nameError && isValid(name)"
          (input)="nameError = false"
        />
      </div>

      <div class="field">
        <label [class.error]="emailError">Your Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          [class.error]="emailError"
          [class.valid]="!emailError && isValid(email)"
          (input)="emailError = false"
        />
      </div>
    </div>

    <div class="field">
      <label [class.error]="messageError">Your Message</label>
      <textarea
        name="message"
        [(ngModel)]="message"
        [class.error]="messageError"
        [class.valid]="!messageError && isValid(message)"
        (input)="messageError = false"
      ></textarea>
    </div>

    <div class="privacy">
      <input
        type="checkbox"
        id="privacy"
        name="privacy"
        [(ngModel)]="privacyAccepted"
        (change)="privacyError = false"
      />
      <label for="privacy">
        I've read the <a href="#">privacy policy</a> and agree to the processing of my data as
        outlined.
      </label>
    </div>

    <p class="privacy-error" *ngIf="privacyError">Please accept the privacy policy</p>

    <div class="send-wrapper">
      <button class="send-btn" [disabled]="!privacyAccepted">Send</button>
    </div>
  </form>
</section>
