<section class="contact">
  <h2 class="headline">Contact me</h2>
  <button class="arrow"></button>

  <div class="intro-wrapper">
    <p class="intro-text">
      Encourage people to contact you and describe what role you are interested in. Show that you
      will add value to their projects through your work.<br /><br />
      Example: Feel free to get in touch with job offers or opportunities such as …
    </p>

    <div class="contact-details">
      <div class="detail-item ">
        <span class="icon mail"></span>
        <a href="mailto:fohrer.developer@gmail.com" class="contact-link">
          E-mail: fohrer.developer@gmail.com
        </a>
      </div>

      <div class="detail-item">
        <span class="icon phone"></span>
        <a href="tel:015712345668" class="contact-link"> Tel: 0157 123 456 68 </a>
      </div>
    </div>
  </div>

  <form class="form">
    <div class="row">
      <div class="field">
        <label>Your name</label>
        <input type="text" />
      </div>

      <div class="field">
        <label>Your Email</label>
        <input type="email" />
      </div>
    </div>

    <div class="field">
      <label>Your Message</label>
      <textarea></textarea>
    </div>

    <div class="privacy">
      <input type="checkbox" id="privacy" />
      <label for="privacy">
        I've read the <a href="#">privacy policy</a> and agree to the processing of my data as
        outlined.
      </label>
    </div>

    <div class="send-wrapper">
      <button class="send-btn">Send</button>
    </div>
  </form>
</section>
