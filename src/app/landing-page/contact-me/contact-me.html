<section class="contact" id="contact">
  <h2 class="headline">{{ 'CONTACT.HEADLINE' | translate }}</h2>  

  <div class="intro-wrapper">
    <p class="intro-text">
      {{ 'CONTACT.INTRO_TEXT_1' | translate }}
    </p>

    <div class="contact-details">
      <div class="detail-item">
        <a
          class="mail"
          href="mailto:developer@felixrabenhold.de"
          [attr.aria-label]="'CONTACT.MAIL_ARIA' | translate"
        ></a>
      </div>

      <div class="detail-item">
        <a
          class="phone"
          href="tel:+491234567890"
          [attr.aria-label]="'CONTACT.PHONE_ARIA' | translate"
        ></a>
      </div>
    </div>
  </div>

  <form class="form" (submit)="send(contactForm); $event.preventDefault()" #contactForm="ngForm">
    <div class="row">
      <div class="field">
        <label [class.error]="nameError">{{ 'CONTACT.NAME_LABEL' | translate }}</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="contactData.name"
          [class.error]="nameError"
          [class.valid]="!nameError && isValid(contactData.name)"
          (input)="nameError = false"
          (animationstart)="onAutofillDetected($event, 'name')"
        />
      </div>

      <div class="field">
        <label [class.error]="emailError">{{ 'CONTACT.EMAIL_LABEL' | translate }}</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="contactData.email"
          [class.error]="emailError"
          [class.valid]="!emailError && isEmailValid(contactData.email)"
          (input)="emailError = false"
          (animationstart)="onAutofillDetected($event, 'email')"
        />
      </div>
    </div>

    <div class="field">
      <label [class.error]="messageError">{{ 'CONTACT.MESSAGE_LABEL' | translate }}</label>
      <textarea
        name="message"
        [(ngModel)]="contactData.message"
        [class.error]="messageError"
        [class.valid]="!messageError && isValid(contactData.message)"
        (input)="messageError = false"
        (animationstart)="onAutofillDetected($event, 'message')"
      ></textarea>
    </div>

    <label class="privacy-row">
      <span class="checkbox-box">
        <input 
          type="checkbox" 
          name="privacyAccepted"
          class="real-checkbox" 
          [(ngModel)]="privacyAccepted"
          (change)="privacyError = false"
        />
        <span class="custom-checkbox" [class.checked]="privacyAccepted"></span>
      </span>

      <span class="privacy-text">
        {{ 'CONTACT.PRIVACY_TEXT_PRE' | translate }}
        <a routerLink="/privacy">{{ 'CONTACT.PRIVACY_LINK' | translate }}</a>
        {{ 'CONTACT.PRIVACY_TEXT_POST' | translate }}
      </span>
    </label>

    @if (privacyError) {
      <p class="privacy-error">{{ 'CONTACT.PRIVACY_ERROR' | translate }}</p>
    }

    @if (submitSuccess) {
      <p class="submit-feedback success">{{ 'CONTACT.SUCCESS' | translate }}</p>
    }

    @if (submitError) {
      <p class="submit-feedback error-text">{{ 'CONTACT.ERROR' | translate }}</p>
    }

    <div class="send-wrapper">
      <button class="send-btn" [disabled]="isSending">
        {{ (isSending ? 'CONTACT.SENDING' : 'CONTACT.SEND') | translate }}
      </button>
    </div>
  </form>

  <a class="arrow" href="#above_the_fold"></a>
</section>
