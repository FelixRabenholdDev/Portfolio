<section class="colleagues" id="colleagues">
  <div class="heading">
    <span class="headline">{{ 'COLLEAGUES.TITLE' | translate }}</span>
    <span class="subtext">{{ 'COLLEAGUES.SUBTITLE' | translate }}</span>
  </div>

  <div class="colleagues__cards">
    <div class="colleague-card" *ngFor="let colleague of colleagues">
      <h3 class="colleague-name">{{ colleague.name }}</h3>
      <p class="colleague-project">
        {{ 'COLLEAGUES.PROJECT_LABEL' | translate }} <span>{{ colleague.project }}</span>
      </p>
      <p class="colleague-quote">&ldquo;{{ colleague.quoteKey | translate }}&rdquo;</p>
      <a [href]="colleague.linkedin" target="_blank" class="colleague-linkedin">
        {{ 'COLLEAGUES.LINKEDIN_LABEL' | translate }}
      </a>
    </div>
  </div>
</section>
